<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Fight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section class="panel" id="player-panel" aria-label="Player">
      <header class="nameplate"><h2 id="p-name"></h2><span class="lv" id="p-lv"></span></header>
      <div class="stage"><div class="sprite" id="p-sprite"></div><div class="floats" id="p-floats"></div></div>
      <div class="bars">
        <div class="row hp-row"><div class="block-badge" id="p-block"></div><div class="bar hp"><div class="fill" id="p-hp-fill"></div><span class="bar-label"><b>HP</b> <span id="p-hp-txt"></span></span></div></div>
        <div class="row"><div class="block-badge ghost"></div><div class="bar mana"><div class="fill" id="p-mana-fill"></div><span class="bar-label"><b>Mana</b> <span id="p-mana-txt"></span></span></div></div>
        <div class="row"><div class="block-badge ghost"></div><div class="bar stamina"><div class="fill" id="p-stam-fill"></div><span class="bar-label"><b>Stamina</b> <span id="p-stam-txt"></span></span></div></div>
      </div>
      <div class="statuses" id="p-status"></div>
      <div class="actions" id="actions"></div>
    </section>

    <section class="panel" id="enemy-panel" aria-label="Opponent">
      <header class="nameplate"><h2 id="e-name"></h2><span class="lv" id="e-lv"></span></header>
      <div class="stage"><div class="sprite" id="e-sprite"></div><div class="floats" id="e-floats"></div></div>
      <div class="bars">
        <div class="row hp-row"><div class="block-badge" id="e-block"></div><div class="bar hp"><div class="fill" id="e-hp-fill"></div><span class="bar-label"><b>HP</b> <span id="e-hp-txt"></span></span></div></div>
      </div>
      <div class="statuses" id="e-status"></div>
      <div class="intent-box" id="intent"></div>
      <div class="enemy-foot">
        <p class="blurb" id="e-blurb"></p>
        <div class="moves-wrap"><button class="btn" id="moves-btn" type="button">Enemy moves ⓘ</button><div class="moves-pop" id="moves-pop" hidden></div></div>
      </div>
    </section>

    <section id="logbox" aria-label="Combat log">
      <div id="log" aria-live="polite"></div>
      <form id="cli" autocomplete="off"><span class="prompt">&gt;</span><input id="cli-input" type="text" spellcheck="false" placeholder="type a command, e.g. help"></form>
    </section>

    <div id="banner" hidden><div class="banner-card"><h1 id="banner-title"></h1><p id="banner-sub"></p><button class="btn big" id="banner-restart" type="button">Fight again</button></div></div>
  </main>

  <div id="tooltip" role="tooltip" hidden></div>
  <div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cli.js"></script>
  <script>newBattle('grubnik');</script>
</body>
</html>
