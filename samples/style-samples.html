<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Samples</title>
<style>
  :root { --parch: #f2ead8; --dim: #b9ad92; --bronze: #c8913a; --bronze-hi: #e8b768; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; color: var(--parch);
    background: repeating-linear-gradient(90deg, #1d1209 0 3px, transparent 3px 132px), repeating-linear-gradient(90deg, #4a3220 0 132px, #3f2a1a 132px 264px, #52391f 264px 396px); }
  h1 { margin: 0 0 4px; letter-spacing: .1em; text-shadow: 0 2px 0 #000; }
  .lead { margin: 0 0 22px; color: var(--dim); font-style: italic; }
  .style-row { display: grid; grid-template-columns: 250px 1fr 1fr 330px; gap: 18px; align-items: center; margin-bottom: 18px; padding: 16px;
    background: linear-gradient(160deg, #6a6b66, #4d4e4a); border: 4px solid #2c2f33; border-radius: 8px; box-shadow: inset 0 0 0 2px #7a5218, inset 0 0 40px rgba(0,0,0,.5), 0 10px 20px rgba(0,0,0,.6); }
  .label h2 { margin: 0; font-size: 30px; color: var(--bronze-hi); text-shadow: 0 2px 0 #000; }
  .label h3 { margin: 2px 0 8px; font-size: 18px; letter-spacing: .06em; }
  .label p { margin: 0; font-size: 14px; color: #ddd3bc; line-height: 1.35; }
  .stage { height: 340px; display: flex; align-items: flex-end; justify-content: center; border: 3px solid #2c2f33; border-radius: 4px;
    background: radial-gradient(ellipse at 50% 90%, rgba(255,200,120,.17), transparent 65%), linear-gradient(#262420, #1a1815); box-shadow: inset 0 0 30px #000; }
  .stage svg { height: 100%; width: auto; }
  .icons { display: flex; gap: 18px; justify-content: center; }
  .tile { width: 92px; height: 92px; padding: 8px; display: grid; place-items: center; border-radius: 8px; border: 3px solid #55595e;
    background: radial-gradient(circle at 30% 25%, var(--t1), var(--t2) 85%); box-shadow: inset 0 0 0 1px #7a5218, inset 0 -6px 10px rgba(0,0,0,.4), 0 3px 4px rgba(0,0,0,.6); }
  .tile svg { width: 100%; height: 100%; }
  .t-steel { --t1: #8a98a3; --t2: #3b434a; } .t-fire { --t1: #c0602a; --t2: #4d1a0e; } .t-blood { --t1: #b0463a; --t2: #3f1410; }
  .small { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .small .tile { width: 52px; height: 52px; padding: 4px; border-width: 2px; }
  .cap { text-align: center; font-size: 12px; color: var(--dim); margin-top: 6px; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>

<p class="lead">Same characters and icons drawn four ways. Icons are shown at bar size (92px) and at small status size (52px).</p>

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const toHex = (c) => '#' + c.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => toHex(hex(a).map((v, i) => v + (hex(b)[i] - v) * t));
const lighten = (c, t) => mix(c, '#ffffff', t);
const darken = (c, t) => mix(c, '#000000', t);

/* ---------- renderers ---------- */
let uid = 0;
const INK = '#1d140e';

function render(geo, style, big) {
  const id = 's' + (++uid);
  const sc = big ? 1 : 0.32; // scale effects for small viewBoxes
  let defs = '', body = '';
  if (geo.ground) { const [cx, cy, rx, ry] = geo.ground; body += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="rgba(0,0,0,.45)"/>`; }

  if (style === 'ink') {
    defs += `<filter id="${id}c" x="-20%" y="-20%" width="140%" height="140%"><feOffset in="SourceAlpha" dx="${-7 * sc}" dy="${-6 * sc}" result="o"/><feComposite in="SourceAlpha" in2="o" operator="out" result="rim"/><feFlood flood-color="#1a0c06" flood-opacity=".42"/><feComposite in2="rim" operator="in" result="sh"/><feOffset in="SourceAlpha" dx="${3 * sc}" dy="${3 * sc}" result="o2"/><feComposite in="SourceAlpha" in2="o2" operator="out" result="rim2"/><feFlood flood-color="#fff" flood-opacity=".32"/><feComposite in2="rim2" operator="in" result="hl"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/><feMergeNode in="hl"/></feMerge></filter>`;
  }
  if (style === 'paint') {
    defs += `<filter id="${id}c" x="-20%" y="-20%" width="140%" height="140%"><feOffset in="SourceAlpha" dx="${-8 * sc}" dy="${-8 * sc}" result="o"/><feGaussianBlur in="o" stdDeviation="${5 * sc}" result="ob"/><feComposite in="SourceAlpha" in2="ob" operator="out" result="rim"/><feFlood flood-color="#120a06" flood-opacity=".55"/><feComposite in2="rim" operator="in" result="sh"/><feOffset in="SourceAlpha" dx="${4 * sc}" dy="${4 * sc}" result="o2"/><feGaussianBlur in="o2" stdDeviation="${2.5 * sc}" result="ob2"/><feComposite in="SourceAlpha" in2="ob2" operator="out" result="rim2"/><feFlood flood-color="#fff6e0" flood-opacity=".45"/><feComposite in2="rim2" operator="in" result="hl"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/><feMergeNode in="hl"/></feMerge></filter>`;
    defs += `<filter id="${id}g" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="${3 * sc}" stdDeviation="${4 * sc}" flood-color="#000" flood-opacity=".55"/></filter>`;
  }
  if (style === 'wood') {
    defs += `<pattern id="${id}h" patternUnits="userSpaceOnUse" width="${5 * sc + 1.5}" height="${5 * sc + 1.5}" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="${5 * sc + 1.5}" stroke="#1a120a" stroke-width="${1.7 * sc + 0.4}"/></pattern>`;
  }

  let n = 0;
  for (const p of geo.parts) {
    const tf = p.tf ? ` transform="${p.tf}"` : '';
    const pid = `${id}p${n++}`;
    if (p.line) {
      if (!p.w) continue;
      const col = p.ink ? (style === 'paint' ? '#3a1e10' : INK) : style === 'wood' ? INK : p.c;
      const w = p.w * (style === 'wood' && !p.ink ? 0.8 : 1);
      body += `<path d="${p.d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${tf}/>`;
      continue;
    }
    const alpha = p.a ? ` fill-opacity="${p.a}"` : '';
    if (style === 'ink') {
      body += `<path d="${p.d}" fill="${p.c}"${alpha}${p.flat ? '' : ` filter="url(#${id}c)"`}${tf}/>`;
      if (!p.noline) body += `<path d="${p.d}" fill="none" stroke="${INK}" stroke-width="${big ? 3.4 : 1.6}" stroke-linejoin="round"${tf}/>`;
    } else if (style === 'paint') {
      defs += `<linearGradient id="${pid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${lighten(p.c, 0.22)}"/><stop offset=".55" stop-color="${p.c}"/><stop offset="1" stop-color="${darken(p.c, 0.28)}"/></linearGradient>`;
      body += `<path d="${p.d}" fill="url(#${pid})"${alpha}${p.flat ? '' : ` filter="url(#${id}c)"`}${tf}/>`;
      if (!p.noline) body += `<path d="${p.d}" fill="none" stroke="${darken(p.c, 0.55)}" stroke-opacity=".8" stroke-width="${big ? 1.4 : 0.7}" stroke-linejoin="round"${tf}/>`;
    } else if (style === 'wood') {
      const col = mix(desat(p.c, 0.35), '#e6d6b0', 0.22);
      body += `<path d="${p.d}" fill="${col}"${alpha}${tf}/>`;
      if (!p.flat) {
        const off = big ? 10 : 3.2;
        defs += `<mask id="${pid}" maskUnits="userSpaceOnUse" x="-50" y="-50" width="400" height="500"><path d="${p.d}" fill="#fff"${tf}/><g${tf}><path d="${p.d}" fill="#000" transform="translate(${-off} ${-off})"/></g></mask>`;
        body += `<path d="${p.d}" fill="url(#${id}h)" mask="url(#${pid})"${tf}/>`;
      }
      if (!p.noline) body += `<path d="${p.d}" fill="none" stroke="${INK}" stroke-width="${big ? 2.8 : 1.4}" stroke-linejoin="round"${tf}/>`;
    }
  }
  const wrap = style === 'paint' ? `<g filter="url(#${id}g)">${body}</g>` : body;
  return `<svg viewBox="${geo.vb}" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${wrap}</svg>`;
}

/* ---------- pixel art ---------- */
const PAL = {
  k: '#1d1712', s: '#eef2f4', S: '#aab4bc', d: '#6c7680', r: '#c0392b', R: '#7a2420', f: '#eebc92', F: '#c48a64', e: '#1d1712',
  b: '#e8b850', B: '#9a6a20', u: '#4a72b0', U: '#2a4478', w: '#8a5a2c', W: '#4a2e18', g: '#9cc464', G: '#5f8a3a', y: '#f4e27a',
  p: '#e0a090', o: '#f08a2c', O: '#c4452f', Y: '#ffe7a0', c: '#cfe3ea', C: '#8fb0bc', n: '#7a5634', N: '#4a3220', m: '#8d959b', M: '#555d63', t: '#f2ead8',
};
function pixel(rows, scale = 1) {
  const h = rows.length, w = Math.max(...rows.map((r) => r.length));
  let out = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const ch = row[x];
      let run = 1;
      while (x + run < row.length && row[x + run] === ch) run++;
      if (ch !== '.' && PAL[ch]) out += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${PAL[ch]}"/>`;
      x += run;
    }
  });
  return `<svg viewBox="-1 -1 ${w + 2} ${h + 2}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}
